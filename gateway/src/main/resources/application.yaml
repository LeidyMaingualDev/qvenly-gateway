server:
  port: 9000
spring:
  application:
    name: gateway
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: gateway
        health-check-path: /actuator/health
        health-check-interval: 10s
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost:61697"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=0
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - id: qv-ms-plans
          uri: lb://qv-ms-plans
          predicates:
            - Path=/api/plans/**, /api/user-plans/**, /api/plan-history/**, /api/plan-audit/**
          filters:
            - StripPrefix=0
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - id: qv-ms-plans-dashboard
          uri: lb://qv-ms-plans
          predicates:
            - Path=/admin/dashboard/**
          filters:
            - StripPrefix=0
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - id: qv-ms-plans-report
          uri: lb://qv-ms-plans
          predicates:
            - Path=/admin/report/**
          filters:
            - StripPrefix=0
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
management:
  endpoints:
    web:
      exposure:
        include: health,info
jwt:
  secret: dGVzdFNlY3JldEtleUZvckp3dEF1dGhTZXJ2aWNlMTIzNDU2Nzg5MA==
security:
  public-routes:
    - path: /auth/login
      method: POST
    - path: /auth/register
      method: POST
    - path: /auth/forgot-password
      method: POST
    - path: /auth/reset-password
      method: POST
    - path: /auth/refresh-token
      method: POST
    - path: /auth/confirm-email
      method: GET
    - path: /actuator/health
      method: GET
    - path: /actuator/info
      method: GET
    - path: /api/plans
      method: GET
    - path: /api/plans/**
      method: GET
  permissions:
    - path: /auth/logout
      method: POST
      role: USER
    - path: /auth/logout
      method: POST
      role: ADMIN
    # CRUD planes - ADMIN
    - path: /api/plans
      method: POST
      role: ADMIN
    - path: /api/plans/**
      method: PUT
      role: ADMIN
    - path: /api/plans/**
      method: DELETE
      role: ADMIN
    - path: /api/plans
      method: GET
      role: ADMIN
    - path: /api/plans/**
      method: GET
      role: ADMIN
    - path: /api/plans/filter
      method: GET
      role: ADMIN
    # Asignación - ADMIN
    - path: /api/user-plans/assign
      method: POST
      role: ADMIN
    # Adquisición - ORGANIZER
    - path: /api/user-plans/acquire
      method: POST
      role: ORGANIZER
    # Renovación - ADMIN y ORGANIZER
    - path: /api/user-plans/**/renew
      method: PUT
      role: ADMIN
    - path: /api/user-plans/**/renew
      method: PUT
      role: ORGANIZER
    # Consulta plan de un organizador - ADMIN y ORGANIZER
    - path: /api/user-plans/user/**
      method: GET
      role: ADMIN
    - path: /api/user-plans/user/**
      method: GET
      role: ORGANIZER
    # Historial - ADMIN y ORGANIZER
    - path: /api/plan-history/**
      method: GET
      role: ADMIN
    - path: /api/plan-history/**
      method: GET
      role: ORGANIZER
    # Auditoría - ADMIN
    - path: /api/plan-audit
      method: GET
      role: ADMIN
    - path: /api/plan-audit/**
      method: GET
      role: ADMIN
    # Dashboard - ADMIN
    - path: /admin/dashboard/**
      method: GET
      role: ADMIN
    # Dashboard - REPORT
    - path: /admin/report/**
      method: GET
      role: ADMIN
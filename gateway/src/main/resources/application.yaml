server:
  port: 9000

spring:
  application:
    name: gateway
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: gateway
        health-check-path: /actuator/health
        health-check-interval: 10s
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=0

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: dGVzdFNlY3JldEtleUZvckp3dEF1dGhTZXJ2aWNlMTIzNDU2Nzg5MA==

security:
  public-routes:
    - path: /auth/login
      method: POST
    - path: /auth/register
      method: POST
    - path: /auth/forgot-password
      method: POST
    - path: /auth/reset-password
      method: POST
    - path: /auth/refresh-token
      method: POST
    - path: /actuator/health
      method: GET
    - path: /actuator/info
      method: GET
  permissions:
    - path: /auth/logout
      method: POST
      role: USER
    - path: /auth/logout
      method: POST
      role: ADMIN